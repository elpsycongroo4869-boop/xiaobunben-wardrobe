<div id="__ROOT_ID__">
  <button type="button" class="btn" data-notes-toggle aria-expanded="false" aria-controls="__ROOT_ID__-content">创作思路</button>
  <section id="__ROOT_ID__-content" data-notes-content hidden aria-label="本次创作思路">
    <p>拍摄前保存的设计说明，可与成片对照。</p>
    <dl>
__SECTIONS__
    </dl>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('__ROOT_ID__');
  const button = root.querySelector('[data-notes-toggle]');
  const content = root.querySelector('[data-notes-content]');
  button.addEventListener('click', () => {
    const expanded = button.getAttribute('aria-expanded') !== 'true';
    content.hidden = !expanded;
    button.setAttribute('aria-expanded', String(expanded));
  });
})();
</script>
